frr defaults datacenter
hostname spine1
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 ip address 10.0.0.0/31
!
interface eth2
 ip address 10.0.0.4/31
!
interface eth3
 ip address 10.0.0.8/31
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.0.0.1 remote-as 65101
 neighbor 10.0.0.1 description leaf1
 neighbor 10.0.0.5 remote-as 65102
 neighbor 10.0.0.5 description leaf2
 neighbor 10.0.0.9 remote-as 65103
 neighbor 10.0.0.9 description leaf3
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.5 activate
  neighbor 10.0.0.9 activate
  maximum-paths 4
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 attribute-unchanged next-hop
  neighbor 10.0.0.5 activate
  neighbor 10.0.0.5 attribute-unchanged next-hop
  neighbor 10.0.0.9 activate
  neighbor 10.0.0.9 attribute-unchanged next-hop
 exit-address-family
!
