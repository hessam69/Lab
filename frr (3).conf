frr defaults datacenter
hostname leaf3
!
interface lo
 ip address 10.255.1.3/32
!
interface eth1
 ip address 10.0.0.9/31
!
interface eth2
 ip address 10.0.0.11/31
!
router bgp 65103
 bgp router-id 10.255.1.3
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.0.0.8 remote-as 65000
 neighbor 10.0.0.8 description spine1
 neighbor 10.0.0.10 remote-as 65000
 neighbor 10.0.0.10 description spine2
 address-family ipv4 unicast
  network 10.255.1.3/32
  neighbor 10.0.0.8 activate
  neighbor 10.0.0.10 activate
  maximum-paths 4
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.0.0.8 activate
  neighbor 10.0.0.10 activate
  advertise-all-vni
 exit-address-family
!
interface eth3
 ip address 10.30.1.1/24
!
router bgp 65103
 address-family ipv4 unicast
  network 10.30.1.0/24
 exit-address-family
!
