frr defaults datacenter
hostname spine2
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 ip address 10.0.0.2/31
!
interface eth2
 ip address 10.0.0.6/31
!
interface eth3
 ip address 10.0.0.10/31
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.0.0.3 remote-as 65101
 neighbor 10.0.0.3 description leaf1
 neighbor 10.0.0.7 remote-as 65102
 neighbor 10.0.0.7 description leaf2
 neighbor 10.0.0.11 remote-as 65103
 neighbor 10.0.0.11 description leaf3
 address-family ipv4 unicast
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.7 activate
  neighbor 10.0.0.11 activate
  maximum-paths 4
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.3 attribute-unchanged next-hop
  neighbor 10.0.0.7 activate
  neighbor 10.0.0.7 attribute-unchanged next-hop
  neighbor 10.0.0.11 activate
  neighbor 10.0.0.11 attribute-unchanged next-hop
 exit-address-family
!
